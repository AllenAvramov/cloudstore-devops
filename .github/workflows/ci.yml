name: CloudStore CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/deployment.yaml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t cloudstore:ci .

      - name: Start CloudStore image
        run: docker run -d --name cloudstore-test -p 8000:8000 cloudstore:ci

      - name: Verify non-root container user
        run: |
          USER_ID=$(docker exec cloudstore-test id -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" != "0"

      - name: Smoke test CloudStore
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "CloudStore is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "CloudStore failed health check"
          docker logs cloudstore-test || true
          exit 1

      - name: Stop CloudStore container
        if: always()
        run: docker rm -f cloudstore-test || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/allenavramov/cloudstore-devops:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Update Kubernetes image reference
        env:
          IMAGE: ghcr.io/allenavramov/cloudstore-devops:sha-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")
          content = path.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*image:\s*)\S+",
              lambda match: match.group(1) + os.environ["IMAGE"],
              content,
          )

          if count != 1:
              raise SystemExit(f"Expected one image field, found {count}")

          path.write_text(updated)
          print(f"Updated image to {os.environ['IMAGE']}")
          PY

      - name: Create deployment update PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update CloudStore deployment image"
          branch: automation/update-cloudstore-image
          delete-branch: true
          title: "Deploy latest CloudStore image"
          body: |
            This PR was generated automatically by GitHub Actions.

            It updates k8s/deployment.yaml to use:
            ghcr.io/allenavramov/cloudstore-devops:sha-${{ github.sha }}

            The image was built and published after CI passed.
          add-paths: k8s/deployment.yaml
