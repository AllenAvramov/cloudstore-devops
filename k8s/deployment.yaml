apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudstore

spec:
  replicas: 5

  selector:
    matchLabels:
      app: cloudstore

  template:
    metadata:
      labels:
        app: cloudstore

    spec:
      containers:
        - name: cloudstore
          image: ghcr.io/allenavramov/cloudstore-devops:sha-3e72d31dcba1eaa21653ef4a5802eac2b351c465
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          # Check if the application needs restarting
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # Check if the application can receive traffic
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
